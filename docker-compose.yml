version: '3'

services:
  nginx-backend:
    image: nginx:mainline-alpine
    container_name: nginx-backend
    volumes:
      - ./data:/usr/share/nginx/html/files
      - ./certs:/etc/nginx/certs
      - ./backend/nginx.conf:/etc/nginx/nginx.conf
    network_mode: "host"
    restart: unless-stopped

  nginx-frontend-http3:
    image: nginx:mainline-alpine
    container_name: nginx-frontend-http3
    volumes:
      - ./frontend/nginx-http3.conf:/etc/nginx/nginx.conf
      - ./certs:/etc/nginx/certs
    network_mode: "host"
    restart: unless-stopped
    depends_on:
      - nginx-backend
