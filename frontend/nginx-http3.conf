user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # 定义日志格式，包含HTTP3相关信息
    log_format quic '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" "$http3"';
    
    access_log /var/log/nginx/access.log quic;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # 上游后端服务器 - 保持使用localhost做测试
    upstream backend_servers {
        server localhost:443;
    }
    
    # SSL设置
    ssl_protocols TLSv1.2 TLSv1.3;  # HTTP3需要TLSv1.3
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    
    # QUIC和HTTP/3设置
    quic_retry on;        # 启用地址验证
    quic_gso on;          # 启用GSO优化
    
    # HTTP服务器配置 - 监听普通HTTP请求
    server {
        listen 80;
        server_name node1.example.com;
        
        # 将HTTP请求重定向到HTTPS
        return 301 https://$host$request_uri;
    }
    
    # HTTP3服务器配置
    server {
        # 同时监听HTTP/3 (QUIC) 和 HTTP/2 (TLS)
        listen 8443 quic reuseport;  # HTTP/3 端口
        listen 8443 ssl http2;       # 同一端口也提供HTTP/2支持
        server_name node1.example.com;
        
        # 指定证书位置
        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        
        # 启用0-RTT (可选)
        ssl_early_data on;
        
        # 必须添加的HTTP/3头，告知浏览器支持HTTP/3
        add_header Alt-Svc 'h3=":8443"; ma=86400';
        
        # 转发请求到后端服务器
        location / {
            proxy_pass https://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 增加代理缓冲区大小，适合大文件传输
            proxy_buffer_size 16k;
            proxy_buffers 32 16k;
            proxy_busy_buffers_size 64k;
            
            # 增加超时时间，适合大文件
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
    }
}
