user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # 定义日志格式，包含HTTP3相关信息
    log_format quic '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" "$http3"';
    
    access_log /var/log/nginx/access.log quic;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # SSL设置
    ssl_protocols TLSv1.2 TLSv1.3;  # HTTP3需要TLSv1.3
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    
    # QUIC和HTTP/3设置
    quic_retry on;        # 启用地址验证
    quic_gso on;          # 启用GSO优化
    
    # HTTP服务器配置 - 监听普通HTTP请求
    server {
        listen 8080;
        server_name node2.example.com;
        
        # 将HTTP请求重定向到HTTPS
        return 301 https://$host$request_uri;
    }
    
    # HTTP2和HTTP3服务器配置
    server {
        # 同时监听HTTP/3 (QUIC) 和 HTTP/2 (TLS)
        listen 443 quic reuseport;  # HTTP/3 端口
        listen 443 ssl http2;       # 同一端口也提供HTTP/2支持
        server_name node2.example.com;
        
        # 指定证书位置
        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;
        
        # 启用0-RTT (可选)
        ssl_early_data on;
        
        # 必须添加的HTTP/3头，告知浏览器支持HTTP/3
        add_header Alt-Svc 'h3=":443"; ma=86400';
        
        # 静态文件服务
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }
        
        # 大文件服务
        location /files/ {
            alias /usr/share/nginx/html/files/;
            autoindex on;
            # 增加大文件传输设置
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
            keepalive_timeout 300;
            client_max_body_size 0;  # 不限制文件大小
        }
    }
}
